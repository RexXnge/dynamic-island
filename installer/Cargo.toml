[package]
name = "dynamic-island-setup"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Build the app first (`cargo build --release` in the repo root): setup embeds its exe.

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
